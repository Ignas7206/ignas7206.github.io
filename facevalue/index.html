<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Face Value</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@500;600;700&family=Karla:wght@400;600&display=swap" />
<style>
:root{
  --bg:#EFEFF4; --surface:#FFFFFF; --surface-2:#E7E7F0; --surface-3:#DBDBE8;
  --ink:#15151F; --ink-2:#4C4C61; --ink-3:#7E7E96;
  --line:#D6D6E4; --line-2:#C2C2D6;
  --accent:#3D3BD6; --accent-2:#2A28A8; --accent-soft:#E0E0FA;
  --hot:#D8442D; --hot-soft:#FBE2DD;
  --gold:#A9761F; --gold-soft:#F7ECD4;
  --teal:#0D7C66; --teal-soft:#D8EFE9;
  --scene:#DEDEE8; --bezel:#1B1B24;
  --shadow:0 1px 2px rgba(21,21,31,.07),0 10px 24px -12px rgba(21,21,31,.26);
  --lift:0 2px 5px rgba(21,21,31,.1),0 26px 46px -18px rgba(21,21,31,.4);
  --display:"Familjen Grotesk",system-ui,sans-serif;
  --body:"Karla",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E16; --surface:#181824; --surface-2:#20202F; --surface-3:#2A2A3C;
    --ink:#ECECF4; --ink-2:#A7A7BE; --ink-3:#75758E;
    --line:#2B2B3C; --line-2:#3A3A4F;
    --accent:#8785FF; --accent-2:#B4B3FF; --accent-soft:#22214A;
    --hot:#FF7C64; --hot-soft:#3A1912;
    --gold:#EBC172; --gold-soft:#352814;
    --teal:#4ECFB0; --teal-soft:#0F3129;
    --scene:#07070C; --bezel:#000000;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 24px -12px rgba(0,0,0,.8);
    --lift:0 2px 5px rgba(0,0,0,.6),0 26px 46px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E16; --surface:#181824; --surface-2:#20202F; --surface-3:#2A2A3C;
  --ink:#ECECF4; --ink-2:#A7A7BE; --ink-3:#75758E;
  --line:#2B2B3C; --line-2:#3A3A4F;
  --accent:#8785FF; --accent-2:#B4B3FF; --accent-soft:#22214A;
  --hot:#FF7C64; --hot-soft:#3A1912;
  --gold:#EBC172; --gold-soft:#352814;
  --teal:#4ECFB0; --teal-soft:#0F3129;
  --scene:#07070C; --bezel:#000000;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 24px -12px rgba(0,0,0,.8);
  --lift:0 2px 5px rgba(0,0,0,.6),0 26px 46px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--scene); color:var(--ink); font-family:var(--body);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display); margin:0; text-wrap:balance; letter-spacing:-.02em}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0; text-align:left}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition-duration:.01ms!important}}
.label{font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}

/* ---------- the phone ---------- */
.scene{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; padding:26px 16px 34px}
.phone{width:392px; height:836px; flex:none; border-radius:50px; padding:11px; background:var(--bezel);
  box-shadow:var(--lift), 0 0 0 1px rgba(255,255,255,.07) inset; position:relative}
.screen{width:100%; height:100%; border-radius:40px; overflow:hidden; background:var(--bg);
  display:flex; flex-direction:column; position:relative}
.notch{position:absolute; top:11px; left:50%; transform:translateX(-50%); width:112px; height:26px;
  background:var(--bezel); border-radius:0 0 15px 15px; z-index:9}
.statusbar{display:flex; align-items:center; padding:11px 22px 3px; font-family:var(--mono); font-size:11px;
  color:var(--ink-2); flex:none}
.statusbar .r{margin-left:auto; letter-spacing:.06em}
.caption{margin:0; max-width:392px; text-align:center; font-size:12.5px; color:var(--ink-3); line-height:1.5}
.caption b{color:var(--ink-2); font-weight:600}
.scene .ghost{background:transparent; border:1px solid var(--line-2); color:var(--ink-2);
  padding:6px 12px; border-radius:8px; font-size:12.5px}
.scene .ghost:hover{border-color:var(--accent); color:var(--accent)}
.tools{display:flex; gap:8px}

.view{flex:1; min-height:0; display:flex; flex-direction:column}
.body{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch}

/* ---------- app bar ---------- */
.appbar{flex:none; display:flex; align-items:center; gap:9px; padding:6px 18px 12px}
.appbar h1{font-size:19px; font-weight:700; margin-right:auto}
.appbar h1 em{font-style:normal; position:relative}
.appbar h1 em::after{content:""; position:absolute; left:-2px; right:-2px; top:47%; height:2.5px;
  background:var(--hot); transform:rotate(-2deg)}
.chip-xp{font-family:var(--mono); font-size:10.5px; padding:4px 9px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent)}
.chip-streak{font-family:var(--mono); font-size:10.5px; padding:4px 9px; border-radius:999px;
  background:var(--hot-soft); color:var(--hot)}
.backbar{flex:none; display:flex; align-items:center; gap:10px; padding:6px 16px 10px}
.backbar button{font-family:var(--display); font-weight:600; font-size:14px; color:var(--accent); flex:none; white-space:nowrap}
.backbar strong{font-family:var(--display); font-size:15.5px; font-weight:600}
.backbar .sub{font-size:11.5px; color:var(--ink-3); display:block; font-family:var(--body); font-weight:400}

/* ---------- tab bar ---------- */
.tabs{flex:none; display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line);
  background:var(--surface); padding:7px 6px 16px}
.tab{display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 0; border-radius:10px;
  color:var(--ink-3); position:relative}
.tab .ic{display:block; width:21px; height:21px}
.tab .ic svg{display:block; width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.tab .tx{font-family:var(--mono); font-size:9px; letter-spacing:.07em; text-transform:uppercase}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute; top:2px; right:calc(50% - 19px); min-width:16px; height:16px; border-radius:999px;
  background:var(--hot); color:#fff; font-family:var(--mono); font-size:9.5px; display:grid; place-items:center; padding:0 4px}

/* ---------- deck ---------- */
.deckwrap{padding:0 16px 14px; display:flex; flex-direction:column; height:100%}
.deckline{display:flex; align-items:baseline; gap:8px; margin-bottom:9px}
.deckline h2{font-size:16px; font-weight:600}
.deckline .label{margin-left:auto}
.stage{position:relative; flex:1; min-height:0}

.card{position:absolute; top:0; left:0; right:0; border-radius:20px; padding:15px; background:var(--surface);
  border:1px solid var(--line); box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden}
.card[data-depth="0"]{box-shadow:var(--lift); cursor:grab; touch-action:pan-y}
.card[data-depth="0"].drag{cursor:grabbing; transition:none}
.card[data-depth="1"]{transform:translateY(9px) scale(.972); z-index:-1}
.card[data-depth="2"]{transform:translateY(18px) scale(.944); z-index:-2}
.card.settle{transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.card.gone{transition:transform .34s ease-in,opacity .34s ease-in; opacity:0}
.card.r-rare{border-color:color-mix(in srgb,var(--accent) 46%,var(--line))}
.card.r-legendary{border-color:color-mix(in srgb,var(--gold) 58%,var(--line))}
.foil{position:absolute; inset:0; pointer-events:none; opacity:0; background-size:260% 100%;
  background-image:linear-gradient(105deg,transparent 32%,color-mix(in srgb,var(--gold) 40%,transparent) 46%,transparent 60%);
  animation:sweep 4.5s ease-in-out infinite}
.card.r-rare .foil{opacity:.45; background-image:linear-gradient(105deg,transparent 32%,color-mix(in srgb,var(--accent) 30%,transparent) 46%,transparent 60%)}
.card.r-legendary .foil{opacity:.8}
@keyframes sweep{0%,100%{background-position:170% 0}50%{background-position:-70% 0}}

.cardtop{display:flex; align-items:center; gap:7px}
.rar{font-family:var(--mono); font-size:9px; letter-spacing:.11em; text-transform:uppercase;
  padding:3px 7px; border-radius:5px; border:1px solid}
.rar.common{color:var(--ink-3); border-color:var(--line-2); background:var(--surface-2)}
.rar.uncommon{color:var(--teal); border-color:color-mix(in srgb,var(--teal) 40%,transparent); background:var(--teal-soft)}
.rar.rare{color:var(--accent); border-color:color-mix(in srgb,var(--accent) 42%,transparent); background:var(--accent-soft)}
.rar.legendary{color:var(--gold); border-color:color-mix(in srgb,var(--gold) 46%,transparent); background:var(--gold-soft)}
.cardtop .no{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--ink-3)}

.masked{display:flex; align-items:center; gap:10px; margin-top:12px}
.mug{width:50px; height:50px; flex:none; border-radius:12px; overflow:hidden; border:1px solid var(--line-2);
  position:relative; background:var(--surface-2)}
.mug canvas{display:block; width:100%; height:100%; filter:blur(7px) saturate(.6)}
.mug::after{content:"?"; position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--display); font-weight:700; font-size:21px; color:var(--ink-2); opacity:.7}
.masked .redact{flex:1; min-width:0}
.bar-redact{height:12px; border-radius:3px; background:var(--ink); opacity:.82; margin-bottom:5px}
.bar-redact.short{width:56%}
.masked .note{font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}

.card h3{font-size:23px; font-weight:700; line-height:1.08; margin-top:13px}
.role{font-size:13px; color:var(--ink-2); margin-top:4px}
.place{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-top:3px}
.signals{list-style:none; padding:0; margin:13px 0 0; display:flex; flex-direction:column; gap:7px}
.signals li{display:flex; gap:8px; font-size:13.5px; line-height:1.32; color:var(--ink-2)}
.signals li::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--accent); flex:none; margin-top:6px}
.swap{display:grid; grid-template-columns:1fr 1fr; gap:1px; margin-top:15px; background:var(--line);
  border:1px solid var(--line); border-radius:11px; overflow:hidden}
.swap div{background:var(--surface-2); padding:9px 10px}
.swap .label{display:block; margin-bottom:3px}
.swap p{margin:0; font-size:12.5px; line-height:1.3}

.stamp{position:absolute; top:18px; font-family:var(--display); font-weight:700; font-size:20px;
  letter-spacing:.04em; padding:4px 10px; border:3px solid; border-radius:9px; opacity:0; pointer-events:none; z-index:3}
.stamp.yes{left:16px; transform:rotate(-10deg); color:var(--accent); border-color:var(--accent); background:var(--surface)}
.stamp.no{right:16px; transform:rotate(10deg); color:var(--hot); border-color:var(--hot); background:var(--surface)}
.empty{position:absolute; inset:0; border:1px dashed var(--line-2); border-radius:20px;
  display:grid; place-content:center; text-align:center; gap:8px; padding:26px}
.empty h3{font-size:17px}
.empty p{margin:0; color:var(--ink-2); font-size:13.5px; max-width:30ch}

.acts{display:flex; gap:9px; justify-content:center; margin-top:12px; flex:none}
.act{border-radius:12px; border:1px solid var(--line-2); background:var(--surface); padding:11px 16px;
  font-family:var(--display); font-weight:600; font-size:14px; transition:transform .12s ease; text-align:center}
.act:hover:not(:disabled){transform:translateY(-2px)}
.act:disabled{opacity:.4; cursor:not-allowed}
.act.no{color:var(--hot); border-color:color-mix(in srgb,var(--hot) 38%,var(--line-2))}
.act.yes{color:#fff; background:var(--accent); border-color:var(--accent); flex:1}
.act.ghosty{color:var(--ink-2)}
.act.wide{width:100%}

/* ---------- lists / threads ---------- */
.pad{padding:0 16px 20px}
.secthead{display:flex; align-items:baseline; gap:8px; margin:14px 0 9px}
.secthead .label{margin-right:auto}
.rows{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:13px; overflow:hidden}
.row{display:flex; gap:10px; align-items:center; background:var(--surface); padding:11px 12px; width:100%}
.row:active{background:var(--surface-2)}
.row .av{width:34px; height:34px; flex:none; border-radius:10px; display:grid; place-items:center;
  font-family:var(--display); font-weight:700; font-size:12px; background:var(--accent-soft); color:var(--accent)}
.row .av.hidden{background:var(--ink); color:transparent; opacity:.8}
.row .tx{min-width:0; flex:1}
.row .tx strong{display:block; font-family:var(--display); font-size:14.5px; font-weight:600; line-height:1.2}
.row .tx span{display:block; font-size:12px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .side{margin-left:auto; text-align:right; flex:none}
.row .side .label{display:block}
.tagline{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  padding:3px 7px; border-radius:5px; white-space:nowrap}
.tagline.wait{background:var(--surface-2); color:var(--ink-3); border:1px solid var(--line-2)}
.tagline.live{background:var(--accent-soft); color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 32%,transparent)}
.tagline.signed{background:var(--gold-soft); color:var(--gold); border:1px solid color-mix(in srgb,var(--gold) 38%,transparent)}
.blank{text-align:center; padding:44px 24px; color:var(--ink-3)}
.blank .big{font-size:30px; margin-bottom:10px; opacity:.5}
.blank p{margin:0; font-size:13.5px; line-height:1.5}

.chatmini{display:flex; gap:10px; align-items:center; padding:11px 12px; background:var(--surface);
  border:1px solid var(--line); border-radius:13px; margin-bottom:12px}
.chatmini .av{width:36px; height:36px; flex:none; border-radius:10px; overflow:hidden; border:1px solid var(--line-2)}
.chatmini canvas{display:block; width:100%; height:100%}
.chatmini strong{display:block; font-family:var(--display); font-size:14.5px; font-weight:600}
.chatmini span{font-size:11.5px; color:var(--ink-3)}
.wants{background:var(--surface-2); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:10px; padding:9px 11px; margin-bottom:14px}
.wants .label{display:block; margin-bottom:3px}
.wants p{margin:0; font-size:13px; line-height:1.35}

.msgs{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}
.msg{max-width:82%; padding:9px 12px; border-radius:15px; font-size:13.5px; line-height:1.4;
  animation:pop-in .26s ease both}
.msg.them{align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:5px}
.msg.you{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px}
.msg.sys{align-self:center; background:var(--gold-soft); color:var(--gold); font-family:var(--mono);
  font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; border-radius:999px; padding:5px 11px}
@keyframes pop-in{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
.typing{align-self:flex-start; display:flex; gap:4px; padding:11px 13px; background:var(--surface);
  border:1px solid var(--line); border-radius:15px; border-bottom-left-radius:5px}
.typing i{width:5px; height:5px; border-radius:50%; background:var(--ink-3); animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

.openers{display:flex; flex-direction:column; gap:7px; margin-bottom:12px}
.opener{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  font-size:13px; line-height:1.35; color:var(--ink-2)}
.opener:hover{border-color:var(--accent)}
.opener b{display:block; font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:3px}
.composer{display:flex; gap:8px; padding:10px 16px 14px; border-top:1px solid var(--line);
  background:var(--surface); flex:none}
.composer input{flex:1; min-width:0; font:inherit; font-size:13.5px; color:var(--ink); background:var(--bg);
  border:1px solid var(--line-2); border-radius:999px; padding:9px 14px}
.composer button{font-family:var(--display); font-weight:600; font-size:14px; color:var(--accent); padding:0 4px}
.composer button.plan{color:var(--gold)}

/* ---------- sheets ---------- */
.scrim{position:absolute; inset:0; z-index:40; background:color-mix(in srgb,var(--ink) 55%,transparent);
  display:flex; align-items:flex-end; animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%; background:var(--surface); border-radius:24px 24px 40px 40px; padding:20px 18px 26px;
  max-height:86%; overflow-y:auto; animation:up .3s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px; height:4px; border-radius:3px; background:var(--line-2); margin:0 auto 14px}
.sheet h2{font-size:21px; font-weight:700}
.sheet .sub{margin:6px 0 0; font-size:13.5px; color:var(--ink-2)}
.picks{display:flex; flex-direction:column; gap:8px; margin-top:15px}
.pick{display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:13px;
  padding:12px; background:var(--bg)}
.pick.on{border-color:var(--accent); background:var(--accent-soft)}
.pick .ic{font-size:17px; flex:none}
.pick strong{display:block; font-family:var(--display); font-size:14.5px; font-weight:600}
.pick span{display:block; font-size:12px; color:var(--ink-3)}
.slotrow{display:flex; gap:7px; margin-top:12px; flex-wrap:wrap}
.slotpick{font-family:var(--mono); font-size:11.5px; padding:8px 12px; border-radius:999px;
  border:1px solid var(--line-2); background:var(--bg); color:var(--ink-2)}
.slotpick.on{border-color:var(--accent); background:var(--accent); color:#fff}

/* ---------- reveal ---------- */
.reveal{text-align:center}
.face{width:82px; height:82px; margin:0 auto 13px; border-radius:20px; overflow:hidden;
  border:1px solid var(--line-2); animation:flip .7s cubic-bezier(.3,1.2,.4,1)}
.face canvas{display:block; width:100%; height:100%}
@keyframes flip{from{transform:rotateY(180deg) scale(.6)}to{transform:none}}
.reveal h2{font-size:24px}
.reveal .who{margin:5px 0 0; font-size:13.5px; color:var(--ink-2)}
.reveal .was{margin:13px 0 0; font-size:13px; color:var(--ink-2); background:var(--bg);
  border-radius:11px; padding:10px 12px}
.reveal .was b{color:var(--ink)}
.gain{display:flex; justify-content:center; gap:7px; flex-wrap:wrap; margin-top:13px}
.gain span{font-family:var(--mono); font-size:11px; padding:5px 10px; border-radius:999px;
  background:var(--teal-soft); color:var(--teal); border:1px solid color-mix(in srgb,var(--teal) 32%,transparent)}
.gain span.gold{background:var(--gold-soft); color:var(--gold); border-color:color-mix(in srgb,var(--gold) 36%,transparent)}

/* ---------- collection ---------- */
.slots{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.slot{border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:9px;
  min-height:92px; display:flex; flex-direction:column; gap:4px}
.slot.locked{border-style:dashed; background:transparent; align-items:center; justify-content:center; text-align:center}
.slot.locked .q{font-family:var(--display); font-weight:700; font-size:17px; color:var(--ink-3); opacity:.45}
.slot .av{width:24px; height:24px; border-radius:7px; display:grid; place-items:center;
  font-family:var(--display); font-weight:700; font-size:10px; background:var(--accent-soft); color:var(--accent)}
.slot strong{font-family:var(--display); font-size:12.5px; font-weight:600; line-height:1.15}
.slot span{font-size:10.5px; color:var(--ink-3); line-height:1.25}
.slot.r-rare{border-color:color-mix(in srgb,var(--accent) 42%,var(--line))}
.slot.signed{border-color:color-mix(in srgb,var(--gold) 52%,var(--line));
  background:linear-gradient(150deg,var(--gold-soft),var(--surface) 66%)}
.slot.signed .av{background:var(--gold-soft); color:var(--gold)}
.slot .seal{font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold)}

function portrait(cv, seed){
  const ctx = cv.getContext("2d"), [h,s,l] = seed, w = cv.width, ht = cv.height;
  ctx.fillStyle = "hsl(" + h + "," + s + "%," + l + "%)"; ctx.fillRect(0,0,w,ht);
  for(let i=0;i<7;i++){
    ctx.fillStyle = "hsla(" + ((h + i*26) % 360) + "," + (s-8) + "%," + (l + (i%2?16:-14)) + "%,.62)";
    ctx.beginPath();
    ctx.arc(w*(.18+.13*i), ht*(.28 + .1*((i*3)%5)), w*(.1+.045*((i*2)%4)), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle = "hsla(" + h + ",70%," + Math.max(12,l-30) + "%,.5)"; ctx.fillRect(0, ht*.68, w, ht*.32);
}
function paintAll(root){

    return '<button class="tab' + (route.tab===t.id ? " on" : "") + '" type="button" data-tab="' + t.id + '">' +
      '<span class="ic">' + ICONS[t.id] + '</span><span class="tx">' + t.tx + '</span>' +
      (n ? '<span class="dot">' + n + '</span>' : '') + '</button>';
  }).join("");
  tabsEl.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{

}

function bar(){

  return '<header class="appbar"><h1>Face <em>Value</em></h1>' +

}
function backbar(title, sub){

    '<strong>' + title + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</strong></div>';
}

function draw(){
  appEl.hidden = false; obEl.hidden = true;
  bodyEl.classList.remove("deck");
  underEl.innerHTML = "";
  tabsEl.hidden = false;
  if(route.thread) viewThread();
  else if(route.tab === "deck") viewDeck();
  else if(route.tab === "threads") viewThreads();
  else if(route.tab === "cards") viewCards();
  else viewMe();
  renderTabs();
  paintAll(bodyEl);
}

/* ================= deck ================= */
function queue(){ return PEOPLE.filter(p => !state.done[p.id]); }
let current = null;

function viewDeck(){
  const q = queue();
  current = q[0] || null;
  topbarEl.innerHTML = bar();
  bodyEl.classList.add("deck");
  bodyEl.innerHTML = '<div class="deckwrap"><div class="deckline"><h2>Today’s table</h2>' +
    '<span class="label">' + q.length + (q.length===1?" card left":" cards left") + '</span></div>' +
    '<div class="stage" id="stage"></div></div>';
  underEl.innerHTML = '<div class="acts" style="padding:0 16px 12px">' +
    '<button class="act no" id="passBtn" type="button">Pass</button>' +
    '<button class="act ghosty" id="undoBtn" type="button">Undo</button>' +
    '<button class="act yes" id="yesBtn" type="button">Trade cards</button></div>';

  const stage = document.getElementById("stage");
  if(!q.length){
    stage.innerHTML = '<div class="empty"><h3>Table cleared</h3>' +
      '<p>Sixteen cards a day, then it closes. Scarcity is the point — the people still in your threads are the game now.</p></div>';
  } else {
    q.slice(0,3).reverse().forEach(p=>{
      const el = document.createElement("article");
      el.className = "card r-" + p.rar;
      el.dataset.depth = String(q.indexOf(p));
      el.innerHTML = cardHTML(p);
      stage.appendChild(el);
    });
    paintAll(stage);
    attachDrag(stage);
  }
  document.getElementById("passBtn").disabled = !current;
  document.getElementById("yesBtn").disabled = !current;
  document.getElementById("undoBtn").disabled = !history.length;
  document.getElementById("passBtn").addEventListener("click", ()=>decide("pass"));
  document.getElementById("yesBtn").addEventListener("click", ()=>decide("yes"));
  document.getElementById("undoBtn").addEventListener("click", undo);
}

function decide(action){
  if(!current) return;
  const p = current, matched = action === "yes" && p.likes;
  const stage = document.getElementById("stage");
  const top = stage && stage.querySelector('[data-depth="0"]');
  if(top){
    top.classList.add("gone");
    top.style.transform = "translateX(" + (action==="yes"?620:-620) + "px) rotate(" + (action==="yes"?20:-20) + "deg)";
  }
  let combo = false;
  state.done[p.id] = action;
  if(matched){
    combo = state.lastSet && state.lastSet !== p.set;
    state.traded.push(p.id);
    state.threads[p.id] = {msgs:[], plan:null};
    state.xp += XP[p.rar] + (combo ? MEET_BONUS : 0);
    state.lastSet = p.set;
    state.fresh = p.id;
  }
  history.push({id:p.id, action, matched, combo, rar:p.rar});
  save();
  setTimeout(()=>{
    draw();
    if(matched) sheetReveal(p, combo);
    else if(action === "yes") toast("Sent. They have not traded back — yet.");
  }, 240);
}

function undo(){
  const h = history.pop();
  if(!h) return;
  delete state.done[h.id];
  if(h.matched){
    state.traded = state.traded.filter(x=>x!==h.id);
    state.signed = state.signed.filter(x=>x!==h.id);
    delete state.threads[h.id];
    state.xp = Math.max(0, state.xp - XP[h.rar] - (h.combo?MEET_BONUS:0));
  }
  save(); draw();
}

function attachDrag(stage){
  const card = stage.querySelector('[data-depth="0"]');
  if(!card) return;
  const yes = card.querySelector(".stamp.yes"), no = card.querySelector(".stamp.no");
  let x0 = 0, dx = 0, on = false;
  card.addEventListener("pointerdown", e=>{
    on = true; x0 = e.clientX; dx = 0;
    card.setPointerCapture(e.pointerId); card.classList.add("drag");
  });
  card.addEventListener("pointermove", e=>{
    if(!on) return;
    dx = e.clientX - x0;
    card.style.transform = "translateX(" + dx + "px) rotate(" + (dx/24) + "deg)";
    yes.style.opacity = Math.max(0, Math.min(1, dx/95));
    no.style.opacity = Math.max(0, Math.min(1, -dx/95));
  });
  const end = ()=>{
    if(!on) return; on = false; card.classList.remove("drag");
    if(Math.abs(dx) > 95){ decide(dx > 0 ? "yes" : "pass"); return; }
    card.classList.add("settle"); card.style.transform = "";
    yes.style.opacity = 0; no.style.opacity = 0;
    setTimeout(()=>card.classList.remove("settle"), 300);
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

/* ================= threads ================= */
function pendingIds(){
  return Object.keys(state.done).filter(id => state.done[id] === "yes" && !state.traded.includes(id));
}

function viewThreads(){
  topbarEl.innerHTML = bar();
  const live = state.traded.slice().reverse(), pend = pendingIds().reverse();
  let html = '<div class="pad">';
  if(!live.length && !pend.length){
    html += '<div class="blank"><div class="big"><svg viewBox="0 0 24 24" width="34" height="34" style="fill:none;stroke:currentColor;stroke-width:1.5"><rect x="7" y="3.5" width="13" height="17" rx="2.5"/><path d="M4 6.5v11.5a2.5 2.5 0 0 0 2.5 2.5"/></svg></div><p>Nothing here yet. Trade with someone on the Deck and the conversation opens right here.</p></div>';
  }
  if(live.length){
    html += '<div class="secthead"><span class="label">Open threads</span></div><div class="rows">';
    html += live.map(id=>{
      const p = person(id), th = state.threads[id] || {msgs:[]};
      const last = th.msgs.length ? th.msgs[th.msgs.length-1] : null;
      const sub = th.plan ? "Meeting " + th.plan.slot + " · " + th.plan.kind
        : (last ? (last.who === "you" ? "You: " : first(p.name) + ": ") + last.t : "Traded. Nobody has said anything yet.");
      const tag = state.signed.includes(id) ? '<span class="tagline signed">Signed</span>'
        : (th.msgs.length ? '' : '<span class="tagline live">New</span>');
      return '<button class="row" type="button" data-open="' + id + '"><span class="av">' + p.init + '</span>' +
        '<span class="tx"><strong>' + p.name + '</strong><span>' + esc(sub) + '</span></span>' +
        (tag ? '<span class="side">' + tag + '</span>' : '') + '</button>';
    }).join("") + '</div>';
  }
  if(pend.length){
    html += '<div class="secthead"><span class="label">Sent, no answer</span></div><div class="rows">';
    html += pend.map(id=>{
      const p = person(id);
      return '<div class="row"><span class="av hidden">' + p.init + '</span>' +
        '<span class="tx"><strong>' + p.alias + '</strong><span>' + p.role + '</span></span>' +
        '<span class="side"><span class="tagline wait">Waiting</span></span></div>';
    }).join("") + '</div>';
  }
  bodyEl.innerHTML = html + '</div>';
  bodyEl.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{
    route.thread = b.dataset.open; draw();
  }));

function openersFor(p){
  const me = state.profile.card, job = lower(me.role.split(" · ")[0]);
  return [
    {k:"On what they want", t:"You need " + lower(p.needs) + ". I might have that. Two questions before I waste your afternoon?"},
    {k:"On their card", t:"“" + p.sig[1] + "” — that’s the line I swiped on. How did you end up there?"},
    {k:"No pitch", t:"No pitch. I’m in " + me.city + ", " + job + ". I’d rather find out in twenty minutes than over six emails."}
  ];
}

function viewThread(){
  const id = route.thread, p = person(id), th = state.threads[id];
  topbarEl.innerHTML = backbar(p.name, p.role + " · " + p.city);
  const signed = state.signed.includes(id);

  let html = '<div class="pad">' +
    '<div class="chatmini"><span class="av"><canvas width="90" height="90" data-seed="' + p.seed.join(",") + '"></canvas></span>' +
    '<span><strong>' + p.alias + '</strong><span>' + p.no + ' · ' + SETS[p.set].name + ' · ' + p.rar + '</span></span></div>' +
    '<div class="wants"><span class="label">What they came here for</span><p>' + p.needs + '</p></div>';

  html += '<div class="msgs" id="msgs">' + th.msgs.map(m=>
    m.who === "sys" ? '<div class="msg sys">' + esc(m.t) + '</div>'
    : '<div class="msg ' + m.who + '">' + esc(m.t) + '</div>').join("") + '</div>';

  if(!th.msgs.length){
    html += '<div class="secthead"><span class="label">Openers written from their card</span></div>' +
      '<div class="openers">' + openersFor(p).map((o,i)=>
        '<button class="opener" type="button" data-op="' + i + '"><b>' + o.k + '</b>' + o.t + '</button>').join("") + '</div>';
  }
  bodyEl.innerHTML = html + '</div>';

  underEl.innerHTML = '<div class="composer"><input id="msgIn" type="text" placeholder="' +
    (signed ? "Meeting is set. Say anything." : "Write something") + '" autocomplete="off" />' +
    '<button type="button" id="sendBtn">Send</button>' +
    (signed ? '' : '<button type="button" id="planBtn" class="plan">Plan</button>') + '</div>';

  document.getElementById("backBtn").addEventListener("click",()=>{ route.thread = null; draw(); });
  bodyEl.querySelectorAll("[data-op]").forEach(b=>b.addEventListener("click",()=>{

  if(pb) pb.addEventListener("click",()=>sheetPlan(p));
  paintAll(bodyEl);
  setTimeout(()=>{ bodyEl.scrollTop = bodyEl.scrollHeight; }, 30);

function say(id, text){
  const th = state.threads[id], p = person(id), firstMsg = !th.msgs.length;
  th.msgs.push({who:"you", t:text});
  save(); draw();
  if(firstMsg && REPLIES[id]){
    typing(()=>{ th.msgs.push({who:"them", t:REPLIES[id]}); save(); draw(); }, 1100);
  }
}

function typing(done, wait){
  const box = document.getElementById("msgs");
  if(box){
    const t = document.createElement("div");
    t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
    box.appendChild(t);

}

/* ================= the plan sheet ================= */
function sheetPlan(p){
  let kind = null, slot = null;
  const render = ()=>{
    layerEl.innerHTML = '<div class="scrim"><div class="sheet"><div class="grab"></div>' +
      '<h2>Put it on a calendar</h2>' +
      '<p class="sub">A traded card is worth nothing until you meet. Pick something small — ' + first(p.name) +
      ' has already seen your card, so there is nothing left to sell.</p>' +
      '<div class="picks">' + PLAN_KINDS.map(k=>
        '<button class="pick' + (kind===k.id?" on":"") + '" type="button" data-k="' + k.id + '">' +
        '<span class="ic">' + k.ic + '</span><span><strong>' + k.t + '</strong><span>' + k.d + '</span></span></button>').join("") +
      '</div>' +
      '<div class="secthead" style="margin-bottom:0"><span class="label">When</span></div>' +
      '<div class="slotrow">' + SLOTS.map(sl=>
        '<button class="slotpick' + (slot===sl?" on":"") + '" type="button" data-s="' + sl + '">' + sl + '</button>').join("") + '</div>' +
      '<div class="acts" style="margin-top:18px">' +
        '<button class="act ghosty" type="button" id="pCancel">Not yet</button>' +
        '<button class="act yes" type="button" id="pSend"' + (kind && slot ? "" : " disabled") + '>Send the invite</button>' +
      '</div></div></div>';
    layerEl.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{ kind = b.dataset.k; render(); }));
    layerEl.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>{ slot = b.dataset.s; render(); }));
    document.getElementById("pCancel").addEventListener("click", closeLayer);
    const go = document.getElementById("pSend");
    if(!go.disabled) go.addEventListener("click", ()=>{
      closeLayer();
      commitPlan(p, PLAN_KINDS.find(k=>k.id===kind), slot);
    });
  };
  render();
}

function commitPlan(p, kind, slot){
  const th = state.threads[p.id];
  th.msgs.push({who:"you", t:kind.t + "? " + slot + " works for me."});
  save(); draw();
  typing(()=>{
    th.msgs.push({who:"them", t:ACCEPTS[PEOPLE.indexOf(p) % ACCEPTS.length]});
    th.plan = {kind:kind.t, slot:slot};
    if(!state.signed.includes(p.id)){
      state.signed.push(p.id);
      state.xp += XP[p.rar] + MEET_BONUS;
      state.fresh = p.id;
    }
    th.msgs.push({who:"sys", t:"Card signed · met " + slot});
    save(); draw();
    sheetSigned(p);
  }, 1400);
}

/* ================= collection ================= */
function viewCards(){

/* ================= onboarding ================= */
let ob = {step:0, a:{}, city:CITIES[0]};
function pickOpt(k){ return Q[k].o.find(x=>x.id === ob.a[k]); }

function buildCard(){
  const ind = pickOpt("industry"), ar = pickOpt("arch"),
        wt = pickOpt("want"), of = pickOpt("offer"), tr = pickOpt("truth");
  return {id:"me", set:ar.id, no:"YOU", rar:"common", alias:ar.alias,
    role:ar.role + " · " + ind.l, city:ob.city,
    sig:[ar.sig, tr.l, ind.sig], needs:wt.l, brings:of.l, seed:[232,54,50]};
}

function renderOb(){
  const total = FLOW.length + 1;
  const dots = Array.from({length:total}, (_,i)=>
    '<i class="' + (i===ob.step?"on":(i<ob.step?"past":"")) + '"></i>').join("");

  if(ob.step < FLOW.length){
    const k = FLOW[ob.step], q = Q[k];
    obEl.innerHTML = '<div class="body"><div class="ob"><div class="dots">' + dots + '</div>' +
      '<h2>' + q.t + '</h2><p class="sub">' + q.s + '</p><div class="opts">' +
      q.o.map((o,i)=>'<button class="opt" type="button" data-o="' + o.id + '"><span class="tick">' + (i+1) + '</span>' +
        '<span><strong>' + o.l + '</strong>' + (o.d ? '<span>' + o.d + '</span>' : '') + '</span></button>').join("") +
      '</div><div class="obfoot"><span class="label">Step ' + (ob.step+1) + ' of ' + FLOW.length + '</span>' +
      (ob.step ? '<button class="act ghosty" type="button" id="obBack">Back</button>' : '') + '</div></div></div>';
    obEl.querySelectorAll("[data-o]").forEach(b=>b.addEventListener("click",()=>{
      ob.a[k] = b.dataset.o; ob.step++; renderOb();
    }));
    const bk = document.getElementById("obBack");
    if(bk) bk.addEventListener("click",()=>{ ob.step--; renderOb(); });
    return;
  }

  const card = buildCard();
  obEl.innerHTML = '<div class="body"><div class="ob"><div class="dots">' + dots + '</div>' +
    '<h2>This is your card</h2>' +
    '<p class="sub">Written from your five answers. No photo, no name, no logo.</p>' +
    '<article class="card previewcard r-common">' + cardHTML(card, true) + '</article>' +
    '<div class="selfnote"><p><b>Nobody sees more than this.</b> If someone trades with you, they did it on those lines — which is the only kind of yes worth having.</p></div>' +
    '<div class="cityrow"><span class="label">Where</span><select id="obCity">' +
      CITIES.map(c=>'<option' + (c===ob.city?" selected":"") + '>' + c + '</option>').join("") + '</select></div>' +
    '<div class="acts" style="margin-top:16px"><button class="act ghosty" type="button" id="obBack">Back</button>' +
    '<button class="act yes" type="button" id="obGo">Deal me in</button></div></div></div>';
  paintAll(obEl);
  document.getElementById("obCity").addEventListener("change", e=>{ ob.city = e.target.value; renderOb(); });
  document.getElementById("obBack").addEventListener("click",()=>{ ob.step--; renderOb(); });
  document.getElementById("obGo").addEventListener("click",()=>{
    const fresh = !state.profile;
    state.profile = {card:buildCard(), answers:Object.assign({}, ob.a), city:ob.city};
    if(fresh){
      state.done = {}; state.traded = []; state.signed = []; state.threads = {};
      state.xp = 0; state.lastSet = null; history = [];
    }
    save(); route = {tab:"deck", thread:null}; draw();
    toast(fresh ? "Dealt in. Sixteen cards on the table." : "Card rewritten.");
  });
}

function showOnboarding(){
  ob = {step:0, a:(state.profile ? Object.assign({}, state.profile.answers) : {}),
        city:(state.profile ? state.profile.city : CITIES[0])};
  appEl.hidden = true; obEl.hidden = false;
  renderOb();
}

/* ================= boot ================= */
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  state = {profile:state.profile, done:{}, traded:[], signed:[], threads:{}, xp:0, streak:1, lastSet:null, fresh:null};
  history = []; route = {tab:"deck", thread:null}; save();
  if(state.profile){ draw(); toast("New season. Sixteen fresh cards."); } else showOnboarding();
});
document.addEventListener("keydown", e=>{
  if(layerEl.innerHTML){ if(e.key === "Escape") closeLayer(); return; }
  if(appEl.hidden || route.tab !== "deck" || route.thread) return;
  if(e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if(e.key === "ArrowRight") decide("yes");
  else if(e.key === "ArrowLeft") decide("pass");
  else if(e.key.toLowerCase() === "z") undo();
});

load();
if(state.profile) draw(); else showOnboarding();
</script>
